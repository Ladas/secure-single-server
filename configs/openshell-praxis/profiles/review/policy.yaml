version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt, /sandbox]
  read_write: [/tmp, /dev/null, /home]
landlock: {compatibility: best_effort}
network_policies:
  praxis_gateway:
    name: praxis-gateway
    endpoints:
      - host: host.openshell.internal
        port: @@PRAXIS_PORT@@
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "@@PRAXIS_API_PREFIX@@/v1/models"}
          - allow: {method: POST, path: "@@PRAXIS_API_PREFIX@@/v1/chat/completions"}
    binaries: [{path: /usr/bin/node-26}, {path: /usr/local/bin/opencode}]
