version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt, /app]
  read_write: [/home, /tmp, /dev/null]
landlock: {compatibility: best_effort}
network_policies:
  praxis_gateway:
    name: praxis-gateway
    endpoints:
      - host: host.openshell.internal
        port: @@PRAXIS_PORT@@
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "@@PRAXIS_API_PREFIX@@/v1/models"}
          - allow: {method: POST, path: "@@PRAXIS_API_PREFIX@@/v1/chat/completions"}
    binaries: [{path: /usr/local/bin/node}, {path: /usr/local/bin/openclaw}]
  github_api:
    name: github-api
    endpoints: [{host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}]
    binaries: [{path: /usr/local/bin/node}, {path: /usr/bin/git}]
  github_git:
    name: github-git
    endpoints: [{host: github.com, port: 443}]
    binaries: [{path: /usr/bin/git}]
  npm_registry:
    name: npm-registry
    endpoints: [{host: registry.npmjs.org, port: 443}]
    binaries: [{path: /usr/local/bin/node}, {path: /usr/local/bin/npm}]
